name: CI

# Pull requests and main only: a branch is checked once, as its pull request.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One failing leg does not hide what the other says.
      fail-fast: false
      matrix:
        # Every Node the package says it supports.
        node: [22, 24]
    name: quality (Node ${{ matrix.node }})
    steps:
      # Pinned by commit, as every action here: a tag can be moved to point
      # at other code, a commit cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          # It would look for pnpm to set up its cache before pnpm is installed.
          package-manager-cache: false
      # No pnpm version here: the action reads packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
