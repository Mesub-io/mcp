name: CI

# Pull requests and main only: a branch is checked once, as its pull request.
on:
  pull_request:
  push:
    branches: [main]
    # A version tag is checked like main; it deploys nothing by itself.
    tags: ['v*']
  # Production deploys from here only (#59): this button, run on a v* tag.
  workflow_dispatch:

# A new push cancels the run it supersedes, except on main and on a tag, where
# a run may carry a deploy that must not stop halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One failing leg does not hide what the other says.
      fail-fast: false
      matrix:
        # Every Node the package says it supports.
        node: [22, 24]
    name: quality (Node ${{ matrix.node }})
    steps:
      # Pinned by commit, as every action here: a tag can be moved to point
      # at other code, a commit cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          # It would look for pnpm to set up its cache before pnpm is installed.
          package-manager-cache: false
      # No pnpm version here: the action reads packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  docs-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: docs index
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # The committed index must be what its own docs commit builds: it fetches
      # that commit of Mesub-io/docs, which is public, and needs no dependency.
      - run: node scripts/build-docs-index.mjs --check

  image-dev:
    # The image dev runs from on hermes (#94): hermes pulls it from GHCR
    # itself, so nothing here reaches hermes. verify-dev checks it did.
    needs: [quality, docs-index]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # a public repository never runs on our own machines
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-mcp-dev
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/mesub-io/mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the dev image
        run: >-
          docker buildx build --pull --push
          --build-arg SENTRY_RELEASE=${{ github.sha }}
          --label org.opencontainers.image.source=https://github.com/Mesub-io/mcp
          --label org.opencontainers.image.revision=${{ github.sha }}
          --tag "$IMAGE:dev" --tag "$IMAGE:${{ github.sha }}"
          .

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # main only, after image-dev (#96): waits until mcp-dev.mesub.io runs this
  # commit, so a hermes that stopped pulling shows red here. It reads a public
  # page: no secret, no environment.
  verify-dev:
    needs: [image-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # a public repository never runs on our own machines
    timeout-minutes: 15
    permissions:
      contents: read
    # A newer merge supersedes an older check.
    concurrency:
      group: verify-mcp-dev
      cancel-in-progress: true
    steps:
      # Every 10 s for 10 minutes. A failed or non-JSON answer is "not yet",
      # and only a commit's hex is ever printed, never the answer itself.
      - name: Wait for dev to run this commit
        run: |
          deadline=$((SECONDS + 600))
          while :; do
            release=$(curl -fsS --max-time 10 https://mcp-dev.mesub.io/health 2>/dev/null |
              python3 -c 'import json, re, sys; r = json.load(sys.stdin).get("release"); print(r if isinstance(r, str) and re.fullmatch("[0-9a-f]{40}", r) else "")' 2>/dev/null) || release=""
            echo "dev runs ${release:-no readable commit}"
            [ "$release" = "$GITHUB_SHA" ] && exit 0
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep 10
          done
          echo "::error::dev still runs ${release:-no readable commit}, not $GITHUB_SHA: hermes did not pick up the commit"
          exit 1

  deploy-prod:
    needs: [quality, docs-index]
    # Two acts on purpose (#59): a v* tag pushed, then this workflow run by
    # hand from Actions on that tag, then approved in the prod environment,
    # which takes v* tags only and holds the token. Never main.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: https://mcp.mesub.io
    concurrency:
      group: deploy-mesub-mcp-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history and every branch, origin/main included, for the
          # check below: no fetch after, as the job keeps no credentials.
          fetch-depth: 0

      # Only a version of main ships: a tag pushed on another branch is refused
      # before any secret is read. A guard against a mistake, not against
      # someone with write access, who could edit this step on their tag:
      # that one needs the paid rules (required reviewers, tag rulesets).
      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main" >&2; exit 1; }
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.104
      - name: Deploy to mesub-mcp-prod
        run: flyctl deploy -c fly.prod.toml --remote-only --no-public-ips --build-arg SENTRY_RELEASE=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The release state, never the app's logs: this repository's runs are public.
      - name: Show the release state
        if: failure()
        run: flyctl status -c fly.prod.toml && flyctl releases -c fly.prod.toml | head -n 5
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
