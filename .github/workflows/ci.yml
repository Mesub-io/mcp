name: CI

# Pull requests and main only: a branch is checked once, as its pull request.
on:
  pull_request:
  push:
    branches: [main]

# A new push cancels the run it supersedes, except on main, where a run
# carries a deploy that must not stop halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One failing leg does not hide what the other says.
      fail-fast: false
      matrix:
        # Every Node the package says it supports.
        node: [22, 24]
    name: quality (Node ${{ matrix.node }})
    steps:
      # Pinned by commit, as every action here: a tag can be moved to point
      # at other code, a commit cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          # It would look for pnpm to set up its cache before pnpm is installed.
          package-manager-cache: false
      # No pnpm version here: the action reads packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  docs-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: docs index
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # The committed index must be what its own docs commit builds: it fetches
      # that commit of Mesub-io/docs, which is public, and needs no dependency.
      - run: node scripts/build-docs-index.mjs --check

  # main only, once the checks pass: mcp-dev.mesub.io. A GitHub-hosted runner,
  # which starts empty every time: nothing a branch ran is left beside the
  # token.
  deploy-dev:
    needs: [quality, docs-index]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment holds FLY_API_TOKEN, scoped to mesub-mcp-dev, and
    # releases it to main only.
    environment:
      name: dev
      url: https://mcp-dev.mesub.io
    # Deploys queue rather than cancel each other.
    concurrency:
      group: deploy-mesub-mcp-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.4.104
      # --no-public-ips: reached only through the tunnel, and a plain deploy
      # hands the app a public IP back because fly.toml declares an
      # http_service. The /health check fails this step when the release
      # cannot answer.
      - name: Deploy to mesub-mcp-dev
        run: flyctl deploy --remote-only --no-public-ips
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Show the app logs
        if: failure()
        run: flyctl logs --no-tail | tail -n 40
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
